{% extends 'base.html' %}
{% load static %}

{% block title %}Página no encontrada{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-md-6 text-center">
            <div class="mb-4">
                <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 5rem;"></i>
            </div>
            <h1 class="display-4 fw-bold text-dark mb-3">404</h1>
            <h2 class="h4 text-muted mb-4">Página no encontrada</h2>
            <p class="text-muted mb-4">
                Lo sentimos, el recurso que buscas no existe o ha sido eliminado.
            </p>
            
            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                <a href="{% url 'pacientes:lista' %}" class="btn btn-primary">
                    <i class="bi bi-house-door me-2"></i>Ir a Pacientes
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-2"></i>Volver Atrás
                </button>
            </div>
            
            <div class="mt-5">
                <small class="text-muted">
                    Serás redirigido automáticamente en <span id="countdown">5</span> segundos...
                </small>
            </div>
        </div>
    </div>
</div>

<script>
let seconds = 5;
const countdownEl = document.getElementById('countdown');

const interval = setInterval(() => {
    seconds--;
    countdownEl.textContent = seconds;
    
    if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = "{% url 'pacientes:lista' %}";
    }
}, 1000);
</script>
{% endblock %}
