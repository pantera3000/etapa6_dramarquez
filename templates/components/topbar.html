<!-- Top Navigation Bar -->
<nav class="topbar" id="topbar">
    <div class="topbar-container">
        <!-- Left: Breadcrumbs -->
        <div class="topbar-left">
            <button class="topbar-menu-toggle d-md-none" id="sidebarToggle">
                <i class="bi bi-list"></i>
            </button>
            <nav aria-label="breadcrumb" class="d-none d-md-block">
                <ol class="breadcrumb mb-0" id="breadcrumbNav">
                    <!-- Breadcrumbs will be generated by JavaScript -->
                </ol>
            </nav>
        </div>

        <!-- Right: Actions -->
        <div class="topbar-right">
            <!-- Search Button -->
            <button class="topbar-btn" id="searchTrigger" title="Buscar (Ctrl+K)">
                <i class="bi bi-search"></i>
                <span class="d-none d-sm-inline ms-2">Buscar</span>
                <kbd class="d-none d-lg-inline ms-2">Ctrl+K</kbd>
            </button>

            <!-- User Dropdown -->
            <div class="dropdown">
                <button class="topbar-user-btn dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="topbar-avatar">
                        {{ user.username|first|upper }}
                    </div>
                    <span class="d-none d-sm-inline ms-2">{{ user.username }}</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                    <li>
                        <div class="dropdown-header">
                            <div class="fw-bold">{{ user.get_full_name|default:user.username }}</div>
                            <small class="text-muted">{{ user.email }}</small>
                        </div>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="{% url 'configuracion:editar' %}">
                        <i class="bi bi-gear me-2"></i>Configuración
                    </a></li>
                    <li><a class="dropdown-item" href="#">
                        <i class="bi bi-person me-2"></i>Mi Perfil
                    </a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="{% url 'usuarios:logout' %}">
                        <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                    </a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>
