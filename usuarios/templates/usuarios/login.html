<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Consultorio Dra. Marquez</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        :root {
            --primary-color: #2563eb;
            --secondary-color: #0ea5e9;
            --accent-color: #3b82f6;
        }

        body {
            /* Fondo con imagen y superposición oscura para legibilidad.
               Puedes cambiar la URL por una foto local: '/static/img/tu-foto.jpg' */
            background: linear-gradient(rgba(2, 6, 23, 0.7), rgba(30, 58, 138, 0.6)), 
                        url('https://images.unsplash.com/photo-1629909613654-28e377c37b09?q=80&w=2600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.92); /* Ligeramente más transparente */
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); /* Sombra más dramática */
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(12px); /* Blur más fuerte */
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 3rem 2rem 4rem;
            text-align: center;
            color: white;
            clip-path: ellipse(150% 100% at 50% 0%);
        }
        
        .brand-icon {
            background: rgba(255,255,255,0.2);
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            backdrop-filter: blur(5px);
            font-size: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .login-body {
            padding: 0 2.5rem 2.5rem;
            margin-top: -2rem;
        }

        .form-floating > .form-control {
            border-radius: 0.75rem;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
        }
        
        .form-floating > .form-control:focus {
            background-color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border: none;
            padding: 1rem;
            font-weight: 600;
            border-radius: 0.75rem;
            font-size: 1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-login:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.3);
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
        }

        .alert {
            border-radius: 0.75rem;
            border: none;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .footer-text {
            color: #475569;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 2rem;
            font-weight: 500;
        }

        /* Estilos Toggle Password */
        .password-container {
            position: relative;
        }
        .password-toggle-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            z-index: 5;
            padding: 5px;
            transition: color 0.2s;
        }
        .password-toggle-btn:hover {
            color: var(--primary-color);
        }
        .password-toggle-btn:focus {
            outline: none;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    
    <div class="login-card">
        <div class="login-header">
            <div class="brand-icon">
                <i class="bi bi-person-badge"></i>
            </div>
            <h4 class="fw-bold mb-1">Consultorio Dental</h4>
            <p class="mb-0 opacity-75 small">Bienvenido de nuevo</p>
        </div>
        
        <div class="login-body">
            <div class="card border-0 shadow-sm rounded-4 p-1 mb-4 bg-white" style="margin-top: -30px;">
                <div class="card-body text-center py-2">
                    <small class="text-primary fw-bold text-uppercase ls-1" style="letter-spacing: 1px; font-size: 0.7rem;">Acceso Seguro</small>
                </div>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show d-flex align-items-center" role="alert">
                        <i class="bi bi-info-circle-fill me-2 fs-5"></i>
                        <div>{{ message }}</div>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" class="mt-2">
                {% csrf_token %}
                
                <div class="form-floating mb-3">
                    <input type="text" 
                           name="username" 
                           class="form-control" 
                           id="id_username" 
                           placeholder="Usuario"
                           required
                           autofocus>
                    <label for="id_username" class="text-muted"><i class="bi bi-person me-2"></i>Usuario</label>
                </div>

                <div class="mb-4 password-container">
                    <div class="form-floating">
                        <input type="password" 
                               name="password" 
                               class="form-control" 
                               id="id_password" 
                               placeholder="Contraseña"
                               style="padding-right: 45px;"
                               required>
                        <label for="id_password" class="text-muted"><i class="bi bi-lock me-2"></i>Contraseña</label>
                    </div>
                    <button type="button" class="password-toggle-btn" onclick="togglePassword()" title="Mostrar/Ocultar contraseña">
                        <i class="bi bi-eye-fill" id="toggleIcon"></i>
                    </button>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-login text-white">
                        Ingresar <i class="bi bi-box-arrow-in-right ms-2"></i>
                    </button>
                </div>
                
                <div class="footer-text">
                    <p class="mb-0">&copy; {% now "Y" %} NeuroSystems</p>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('id_password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye-fill');
                toggleIcon.classList.add('bi-eye-slash-fill');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash-fill');
                toggleIcon.classList.add('bi-eye-fill');
            }
        }
    </script>
</body>
</html>
